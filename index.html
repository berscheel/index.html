<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Seguimiento 3° Medio F</title>
<style>:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --line:#DCE1E9; --ink:#17203A; --muted:#5A6479; --brand:#24346B; --brand-ink:#FFFFFF;
  --v:#2E7D32; --v-t:#E6F2E7; --a:#B27A00; --a-lamp:#F2B705; --a-t:#FDF3D6; --r:#C2271F; --r-t:#FBE5E3; --g:#8A93A6; --g-t:#EEF0F4;
  --lamp-off:#2B3350; --housing:#1B2340; --radius:14px;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10141F; --surface:#181E2D; --line:#2B3448; --ink:#E8ECF4; --muted:#A3ADC2; --brand:#8FA4F0; --brand-ink:#10141F;
  --v:#6CC070; --v-t:#1C3321; --a:#F2C14E; --a-t:#3A2F12; --r:#F07167; --r-t:#3D1C1A; --g:#8A93A6; --g-t:#232A3A;
  --lamp-off:#2A3045; --housing:#0B0F18; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 48px}
h1,h2,h3{line-height:1.2;margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px}
.light{background:var(--housing);border-radius:40px;padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.lamp{width:46px;height:46px;border-radius:50%;background:var(--lamp-off)}
.light.r .lamp.r{background:#E5392F;box-shadow:0 0 22px #E5392F}
.light.a .lamp.a{background:var(--a-lamp);box-shadow:0 0 22px var(--a-lamp)}
.light.v .lamp.v{background:#3FAE47;box-shadow:0 0 22px #3FAE47}
.week{color:var(--muted);margin:0 0 4px;font-size:.95rem}
.hero h1{font-size:clamp(1.4rem,3.2vw,2rem);font-weight:700}
.rut{color:var(--muted);margin:2px 0 14px;font-size:.92rem}
.msg{margin:0;padding:12px 16px;border-radius:10px;font-weight:500;max-width:66ch}
.msg.v{background:var(--v-t);color:var(--v)} .msg.a{background:var(--a-t);color:var(--a)} .msg.r{background:var(--r-t);color:var(--r)}
.alert{margin:16px 0 0;background:var(--r-t);border:1.5px solid var(--r);color:var(--ink);border-radius:var(--radius);padding:16px 20px}
.alert h2{font-size:1.05rem;color:var(--r);margin-bottom:6px}
.alert p{margin:6px 0 0}
.alert ul{margin:8px 0 0;padding-left:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--g);border-radius:var(--radius);padding:16px 18px}
.tile.v{border-left-color:var(--v)} .tile.a{border-left-color:var(--a-lamp)} .tile.r{border-left-color:var(--r)}
.tile h3{font-size:.95rem;font-weight:600;color:var(--muted)}
.tile .big{font-size:2rem;font-weight:700;margin:4px 0 2px}
.tile .st{font-size:.92rem;margin:4px 0 0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-top:16px}
.sec h2{font-size:1.15rem;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;width:90px}
.sub{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.82rem;font-weight:700}
.pill.v{background:var(--v-t);color:var(--v)} .pill.a{background:var(--a-t);color:var(--a)} .pill.r{background:var(--r-t);color:var(--r)} .pill.g{background:var(--g-t);color:var(--muted)}
.nota{font-weight:700;font-variant-numeric:tabular-nums}
.nota.r{color:var(--r)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.mo{border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.mo b{display:block;font-size:1.1rem}
.mo span{font-size:.78rem;color:var(--muted)}
.mo.r{background:var(--r-t)} .mo.a{background:var(--a-t)} .mo.v{background:var(--v-t)}
.obs{list-style:none;margin:0;padding:0}
.obs li{padding:12px 0;border-top:1px solid var(--line)}
.obs li:first-child{border-top:0}
.obs .h{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.obs p{margin:0}
.legend{margin-top:16px;font-size:.85rem;color:var(--muted);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.legend p{margin:0 0 4px}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;justify-items:start}
  .light{flex-direction:row}
  .lamp{width:34px;height:34px}
  .tiles,.legend{grid-template-columns:1fr}
}
.gate{max-width:460px;margin:8vh auto 0}
.gate h1{font-size:1.6rem;margin:6px 0 6px}
.gate label{display:block;font-weight:600;margin:18px 0 6px}
.gate input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.15rem}
.gate .btn{width:100%;margin-top:14px;padding:13px}
.err{color:var(--r);min-height:1.5em;margin:10px 0 0;font-size:.92rem}
.mini{display:flex;gap:6px;margin-bottom:8px}.mini span{width:14px;height:14px;border-radius:50%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.priv{font-size:.82rem;color:var(--muted);margin-top:18px}
[hidden]{display:none!important}
@media print{.top .btn{display:none}}
</style></head><body><main class="wrap">
<section id="gate" class="gate card">
  <div class="mini" aria-hidden="true"><span style="background:#E5392F"></span><span style="background:#F2B705"></span><span style="background:#3FAE47"></span></div>
  <h1>Seguimiento del estudiante</h1>
  <p class="muted" style="margin:0"><span id="cur"></span>. Consulta notas, asistencia y observaciones.</p>
  <form id="f" autocomplete="off">
    <label for="rut">RUT del estudiante</label>
    <input id="rut" inputmode="text" placeholder="12.345.678-9" aria-describedby="err" required>
    <div id="pwbox" hidden>
      <label for="pw">Clave del curso</label>
      <input id="pw" type="password" autocomplete="off" placeholder="La entregó el profesor jefe">
    </div>
    <button class="btn" id="go" type="submit">Ver información</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="priv">Información personal y confidencial. Con el RUT solo se muestra la información de ese estudiante; la de los demás está cifrada y no es visible.</p>
</section>
<section id="out" hidden>
  <div class="top"><span class="muted" id="ttl"></span><button class="btn ghost" id="exit" type="button">Cerrar</button></div>
  <div id="panel"></div>
</section>
</main>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fnum(v,d){return Number(v).toLocaleString('es-CL',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d});}
var SEM={v:'Verde',a:'Amarillo',r:'Rojo'};
function pill(c,t){return '<span class="pill '+c+'">'+esc(t)+'</span>';}
function render(el,p,m){
  var h='',ov=p.ov;
  h+='<section class="hero"><div class="light '+ov+'" role="img" aria-label="Semáforo general: '+SEM[ov]+'"><span class="lamp r"></span><span class="lamp a"></span><span class="lamp v"></span></div>';
  h+='<div><p class="week">'+esc(m.curso)+' · '+esc(m.periodo)+' · Actualizado el '+esc(m.fecha)+'</p><h1>'+esc(p.n)+'</h1><p class="rut">RUT '+esc(p.r)+' · N° de lista '+esc(p.l)+'</p>';
  h+='<p class="msg '+ov+'">'+esc(p.hm)+'</p></div></section>';
  if(p.rk){
    h+='<section class="alert" role="alert"><h2>Riesgo de repitencia</h2><ul>';
    p.rk.mot.forEach(function(t){h+='<li>'+esc(t)+'</li>';});
    h+='</ul><p><b>'+esc(p.rk.msg)+'</b></p></section>';
  }
  var no=p.no,as=p.as,ob=p.ob;
  h+='<section class="tiles">';
  h+='<div class="tile '+no.c+'"><h3>Promedio general ('+esc(m.sem)+')</h3><p class="big">'+fnum(no.prom)+'</p><p class="st">'+pill(no.c,no.lbl)+'</p><p class="st">'+esc(no.txt)+'</p></div>';
  h+='<div class="tile '+as.c+'"><h3>Asistencia anual</h3><p class="big">'+fnum(as.pct)+'%</p><p class="st">'+pill(as.c,as.lbl)+'</p><p class="st">'+esc(as.txt)+'</p></div>';
  h+='<div class="tile '+ob.c+'"><h3>Observaciones</h3><p class="big">'+(ob.neg?esc(ob.puesto)+'° lugar':'Sin registros')+'</p><p class="st">'+esc(ob.txt)+'</p></div>';
  h+='</section>';
  h+='<section class="sec"><h2>Notas por asignatura</h2><table class="t"><thead><tr><th>Asignatura</th><th class="n">Nota</th><th>Estado</th></tr></thead><tbody>';
  no.rows.forEach(function(r){
    var v=r.v==null?'—':(r.v==='P'?'P':fnum(r.v));
    h+='<tr><td>'+esc(r.a)+'</td><td class="n nota'+(r.red?' r':'')+'">'+v+'</td><td>'+(r.red?pill('r','En rojo'):(r.v==null?'<span class="sub">Sin nota</span>':(r.v==='P'?'<span class="sub">Pendiente</span>':'')))+'</td></tr>';
  });
  h+='</tbody></table><p class="sub" style="margin:10px 0 0">'+esc(no.rule)+'</p></section>';
  h+='<section class="sec"><h2>Asistencia por mes</h2><div class="months">';
  as.meses.forEach(function(x){h+='<div class="mo '+x.c+'"><b>'+(x.v==null?'—':fnum(x.v,0)+'%')+'</b><span>'+esc(x.m)+'</span></div>';});
  h+='</div><p class="sub" style="margin:10px 0 0">'+esc(as.nota)+'</p></section>';
  h+='<section class="sec"><h2>Observaciones registradas</h2>';
  if(!ob.items.length){h+='<p class="muted">No hay observaciones registradas.</p>';}
  else{h+='<ul class="obs">';ob.items.forEach(function(o){
    h+='<li><div class="h"><b>'+esc(o.f)+'</b>'+pill(o.c,o.t)+'<span class="sub">'+esc(o.d)+'</span></div><p>'+esc(o.x)+'</p></li>';});h+='</ul>';}
  h+='<p class="sub" style="margin:10px 0 0">'+esc(ob.nota)+'</p></section>';
  h+='<section class="legend"><div><p><b>Promoción por notas</b></p><p>Con 1 asignatura en rojo: promedio ≥ 4,5</p><p>Con 2 en rojo: ≥ 5,0 · con 3: ≥ 5,5 · con 4: ≥ 6,0</p><p>5 o más en rojo: riesgo de repitencia</p></div>';
  h+='<div><p><b>Promoción por asistencia</b></p><p>Se requiere un mínimo de '+esc(m.minAs)+'% anual.</p></div>';
  h+='<div><p><b>Semáforo</b></p><p><span class="pill r">Rojo</span> riesgo de repitencia</p><p><span class="pill a">Amarillo</span> sin riesgo, pero con alertas</p><p><span class="pill v">Verde</span> sin alertas</p></div></section>';
  h+='<p class="sub" style="margin-top:14px">Contacto del profesor jefe, '+esc(m.pj)+': <a href="mailto:'+esc(m.mail)+'">'+esc(m.mail)+'</a></p>';
  el.innerHTML=h;
}
(function(){
var DATA=JSON.parse(document.getElementById('panel-data').textContent);
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function normRut(s){return String(s||'').toUpperCase().replace(/[^0-9K]/g,'').replace(/^0+/,'');}
function dvOk(r){if(r.length<2)return false;var body=r.slice(0,-1),dv=r.slice(-1);if(!/^\d+$/.test(body))return false;var s=0,m=2;for(var i=body.length-1;i>=0;i--){s+=parseInt(body[i])*m;m=m===7?2:m+1;}var x=11-(s%11);var e=x===11?'0':x===10?'K':String(x);return e===dv;}
function fmt(r){var b=r.slice(0,-1),d=r.slice(-1);return b.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+d;}
var inp=document.getElementById('rut'),pw=document.getElementById('pw'),btn=document.getElementById('go'),err=document.getElementById('err'),out=document.getElementById('out'),gate=document.getElementById('gate');
document.getElementById('cur').textContent=DATA.m.curso;
if(DATA.pw)document.getElementById('pwbox').hidden=false;
inp.addEventListener('input',function(){var r=normRut(inp.value);if(r.length>1)inp.value=fmt(r);err.textContent='';});
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();var r=normRut(inp.value);
  if(!dvOk(r)){err.textContent='El RUT no es válido. Revisa los números y el dígito verificador.';return;}
  if(DATA.pw&&!pw.value.trim()){err.textContent='Ingresa la clave del curso.';return;}
  btn.disabled=true;btn.textContent='Buscando…';
  try{
    var enc=new TextEncoder();
    var secret=DATA.pw?(r+'|'+pw.value.trim().toLowerCase()):r;
    var km=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveBits']);
    var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(DATA.salt),iterations:DATA.it,hash:'SHA-256'},km,512));
    var key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-GCM',false,['decrypt']);
    var id=hex(await crypto.subtle.digest('SHA-256',bits.slice(32))).slice(0,32);
    var ct=DATA.e[id];
    if(!ct){err.textContent=DATA.pw?'No encontramos información con ese RUT y clave. Revisa los datos o escribe al profesor jefe.':'No encontramos información para ese RUT. Revisa que esté bien escrito o escribe al profesor jefe.';return;}
    var raw=b64d(ct);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
    var p=JSON.parse(new TextDecoder().decode(pt));
    gate.hidden=true;out.hidden=false;
    render(document.getElementById('panel'),p,DATA.m);
    document.getElementById('ttl').textContent='Seguimiento '+DATA.m.curso;
    window.scrollTo(0,0);
  }catch(x){err.textContent='No pudimos abrir la información. Prueba con Chrome, Edge, Safari o Firefox actualizados.';}
  finally{btn.disabled=false;btn.textContent='Ver información';}
});
